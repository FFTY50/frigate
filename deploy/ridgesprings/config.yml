ffmpeg:
  hwaccel_args: preset-vaapi
  output_args:
    record: preset-record-generic

detectors:
  ov:
    type: openvino
    device: GPU

model:
  width: 300
  height: 300
  input_tensor: nhwc
  input_pixel_format: bgr
  path: /openvino-model/ssdlite_mobilenet_v2.xml
  labelmap_path: /openvino-model/coco_91cl_bkgr.txt

detect:
  width: 704
  height: 480
  fps: 5

record:
  enabled: true
  continuous:
    days: 0
  motion:
    days: 365
  alerts:
    pre_capture: 10
    post_capture: 15
    retain:
      days: 365
      mode: motion
  detections:
    pre_capture: 10
    post_capture: 15
    retain:
      days: 365
      mode: motion

snapshots:
  enabled: true
  retain:
    default: 365

birdseye:
  enabled: true
  mode: continuous
  layout:
    max_cameras: 9
    scaling_factor: 4.0

cameras:
  CAM1:
    enabled: true
    live:
      streams:
        Main Stream: CAM1_sub
        High Stream: CAM1
    ffmpeg:
      inputs:
        - path: rtsp://10.7.7.101:554/media/live/1/1
          roles: [record]
        - path: rtsp://10.7.7.101:554/media/live/1/2
          roles: [detect]

  CAM2:
